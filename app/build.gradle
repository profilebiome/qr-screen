plugins {
    id 'com.android.application'
}

// La clave de firma no se publica: vive en keystore.properties (ignorado) o no existe.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseStorePath = keystoreProperties.getProperty('storeFile')
def releaseStoreFile = releaseStorePath ? rootProject.file(releaseStorePath) : null
def canSignRelease = releaseStoreFile != null && releaseStoreFile.exists()

android {
    namespace 'com.drako.qrscreen'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.drako.qrscreen'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.2.0'
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile releaseStoreFile
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
